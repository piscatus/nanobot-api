server.servlet.context-path=/
server.port=${API_PORT}
server.error.include-message=always
spring.web.error.include-message=always
# Keep Jackson 3 serialising like Spring Boot 3 did, so the bot sees identical JSON
spring.jackson.use-jackson2-defaults=true
spring.autoconfigure.exclude=org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration
logging.level.org.springframework.transaction.interceptor=DEBUG
logging.level.org.springframework.data.mongodb.core.MongoTransactionManager=DEBUG